<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Katalog | KAYRAB Admin</title>
  <link rel="icon" href="/images/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" /><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="app">
    <div data-include="/components/admin-sidebar.html"></div>
    <div class="main">
      <header class="topbar">
        <div class="left flex gap-2"><button class="burger btn btn-soft btn-sm">☰</button><h1>Katalog</h1></div>
        <div class="user"><span class="text-sm text-muted" data-user-email></span><span class="avatar" data-user-initial>?</span></div>
      </header>
      <main class="content">
        <div class="card card-pad">
          <div class="section-head">📄 Katalog PDF Yönetimi</div>
          <p class="text-sm text-muted mb-4">Yüklediğiniz PDF, web sitesinin katalog sayfasında kaydırmalı kartların altındaki özel görüntüleyicide gösterilir. Boş bırakırsanız bu bölüm sitede görünmez.</p>

          <div id="current-status" class="mb-4"></div>

          <form id="catalog-form" class="form-grid" style="grid-template-columns:1fr">
            <div id="upload-slot"></div>
            <div class="field full flex gap-2">
              <button type="submit" class="btn btn-primary">💾 Kaydet</button>
            </div>
          </form>

          <!-- PDF Önizleme -->
          <div id="pdf-preview-wrap" style="display:none" class="mt-4">
            <div class="section-head" style="margin-top:1.5rem">📑 PDF Önizleme</div>
            <div class="pdf-preview-window">
              <div class="pdf-chrome">
                <div class="pdf-dots"><span class="dot-r"></span><span class="dot-y"></span><span class="dot-g"></span></div>
                <span class="pdf-label">KATALOG</span>
                <span class="pdf-badge">PDF</span>
              </div>
              <div id="pdf-frame-slot"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/admin/api.js"></script>
  <script src="/js/admin/ui.js"></script>
  <script src="/js/admin/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin/catalog.js"></script>
</body>
</html>
