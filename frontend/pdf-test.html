<!doctype html>
<html><head><meta charset="utf-8"><title>PDF Test</title>
<style>body{background:#1a1a1a;color:#fff;font:14px monospace;padding:1rem}
h3{margin-top:1.5rem;color:#ffd}a{color:#7af}pre{background:#000;padding:.5rem;border-radius:4px}
.box{height:40vh;border:1px solid #444;border-radius:8px;overflow:hidden;margin-top:.5rem}</style></head>
<body>
<h3>1) embed (cross-origin http://localhost:5281)</h3>
<pre id="u1"></pre>
<div class="box" id="b1"></div>

<h3>2) iframe (cross-origin)</h3>
<div class="box"><iframe id="b2" style="width:100%;height:100%;border:0"></iframe></div>

<h3>3) object (cross-origin)</h3>
<div class="box" id="b3"></div>

<h3>4) embed via Google viewer</h3>
<div class="box"><iframe id="b4" style="width:100%;height:100%;border:0"></iframe></div>

<script>
const URL = "http://localhost:5281/docs/0b0eca904d9c444d88ef22f15145b132.pdf";
document.getElementById("u1").textContent = URL;

const b1 = document.getElementById("b1");
b1.innerHTML = `<embed src="${URL}" type="application/pdf" style="width:100%;height:100%">`;
document.getElementById("b2").src = URL;
document.getElementById("b3").innerHTML = `<object data="${URL}" type="application/pdf" style="width:100%;height:100%">fallback</object>`;
document.getElementById("b4").src = "https://docs.google.com/viewer?url=" + encodeURIComponent(URL) + "&embedded=true";
</script>
</body></html>
