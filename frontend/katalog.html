<!doctype html>
<html lang="tr" class="bg-background">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Katalog | KAYRAB Aluminyum</title>
  <meta name="description" content="Ürün kataloğu — teknik detaylar ve ürün kodları." />
  <link rel="icon" href="/images/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" /><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" /></noscript>
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <!-- PDF.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="font-sans antialiased">
  <div data-include="/components/navbar.html"></div>
  <main class="min-h-screen">
    <!-- Top Interactive Deck Showcase -->
    <section class="relative min-h-screen overflow-hidden pt-28 pb-20">
      <div aria-hidden class="pointer-events-none absolute left-1/2 top-40 -z-10 h-[420px] w-[820px] -translate-x-1/2 rounded-full opacity-25 blur-3xl" style="background: radial-gradient(circle, oklch(0.78 0.148 62) 0%, transparent 70%);"></div>
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="mx-auto max-w-2xl text-center">
          <div class="reveal"><span class="inline-flex items-center gap-2 text-xs font-semibold tracking-[0.3em] text-primary"><span class="h-px w-8 bg-primary"></span><span data-i18n="catalog.tag">DİJİTAL KATALOG</span></span></div>
          <h2 class="reveal mt-4 text-balance font-display text-3xl font-bold tracking-tight sm:text-4xl md:text-5xl" data-i18n="catalog.title">Ürün Kataloğu</h2>
          <p class="reveal mt-4 text-pretty text-base leading-relaxed text-muted-foreground" data-i18n="catalog.desc">Kartları sağa veya sola kaydırarak sistemleri keşfedin.</p>
        </div>
      </div>
      <div class="relative mt-14">
        <div id="catalog-deck-mount"></div>
        <p class="mt-8 flex items-center justify-center gap-2 text-xs tracking-wide text-muted-foreground">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4 text-primary"><path d="M9 9h.01M15 9h.01M8 13a4 4 0 0 0 8 0"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><path d="M18.63 13A17.89 17.89 0 0 1 18 8"/><path d="M6 8a17.89 17.89 0 0 0-.63 5"/><path d="M10.5 5.5C12 4 13 4 14 4"/></svg>
          <span data-i18n="catalog.hint">Kaydırarak veya ok tuşlarıyla gezin</span>
        </p>
      </div>
    </section>

    <!-- Bottom Digital PDF Flipbook / Page Showcase Section -->
    <section id="catalog-pdf-section" class="relative mx-auto max-w-7xl px-4 pb-24 sm:px-6 lg:px-8" style="display:none">
      <div aria-hidden class="pointer-events-none absolute left-1/2 top-1/2 -z-10 h-[380px] w-[720px] -translate-x-1/2 -translate-y-1/2 rounded-full opacity-20 blur-3xl" style="background: radial-gradient(circle, oklch(0.78 0.148 62) 0%, transparent 70%);"></div>
      <div class="mb-8">
        <div class="reveal"><span class="inline-flex items-center gap-2 text-xs font-semibold tracking-[0.3em] text-primary"><span class="h-px w-8 bg-primary"></span><span data-i18n="catalog.tag">TEKNİK DOKÜMAN</span></span></div>
        <h2 class="reveal mt-3 font-display text-3xl font-bold tracking-tight sm:text-4xl" data-i18n="catalog.pdf.title">Kataloğun Tamamı</h2>
        <p class="reveal mt-2 text-base text-muted-foreground" data-i18n="catalog.pdf.desc">Tüm sistemlerimizin teknik detaylarını ve ürün kodlarını içeren kataloğu sayfa sayfa inceleyin veya indirin.</p>
      </div>
      
      <!-- Interactive PDF Flipbook Mount Point -->
      <div class="reveal" style="transition-delay:.2s">
        <div id="catalog-pdf-mount"></div>
      </div>
    </section>
  </main>
  <div data-include="/components/footer.html"></div>
  <script src="/js/i18n.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/catalog-deck.js"></script>
  <script src="/js/catalog-pdf.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function render() {
      const api = await API.products();
      const products = (api && api.length) ? api : DATA.products;
      CatalogDeck.render(products.sort((a,b)=>(a.order||0)-(b.order||0)), document.getElementById("catalog-deck-mount"));
      I18N.apply();
      App.initReveal();

      const settings = await API.settings();
      const pdf = settings && settings.catalog_pdf_url ? settings.catalog_pdf_url.trim() : "";
      const section = document.getElementById("catalog-pdf-section");
      const pdfMount = document.getElementById("catalog-pdf-mount");
      
      if (pdf && pdfMount) {
        const abs = resolveUrl(pdf);
        section.style.display = "block";
        CatalogPdf.init(abs, pdfMount);
      }
    }
    document.addEventListener("app-ready", render);
  </script>
</body>
</html>
